name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_OPTIONS: '--max_old_space_size=4096'

jobs:
  lint:
    name: Linting Check
    uses: the-guild-org/shared-config/.github/workflows/lint.yml@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
    with:
      script: pnpm ci:lint
      packageManager: pnpm
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  prettier-check:
    name: 🧹 Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup env
        uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
        with:
          nodeVersion: 24
          packageManager: pnpm
      - name: Prettier Check
        run: pnpm prettier:check
  dev-tests:
    name: Validating dev-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        method:
          - 'cjs'
          - 'esm'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup env
        uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
        with:
          nodeVersion: 24
          packageManager: pnpm
      - name: Build
        run: pnpm build
        env:
          CI: true
      - name: Test dev-tests ${{matrix.method}}
        run: |
          pnpm run generate:examples:${{matrix.method}}
          git diff --exit-code -- dev-test/
  esm:
    name: Testing exports integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup env
        uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
        with:
          nodeVersion: 24
          packageManager: pnpm
      - name: Build
        run: pnpm build
        env:
          CI: true
      - name: Test ESM & CJS integrity
        run: pnpm bob check
  test:
    name:
      Unit Test on Node ${{matrix.node_version}} (${{matrix.os}}) and GraphQL
      v${{matrix.graphql_version}}
    runs-on: ubuntu-latest
    needs:
      - lint
      - prettier-check
      - dev-tests
      - esm
    strategy:
      matrix:
        os: [ubuntu-latest] # remove windows to speed up the tests
        node_version: [22, 24]
        graphql_version: [16, 17]
        include:
          - node_version: 22
            os: windows-latest
            graphql_version: 16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup env
        uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
        with:
          nodeVersion: ${{matrix.node_version}}
          packageManager: pnpm
      - name: Use GraphQL v${{matrix.graphql_version}}
        run: node ./scripts/match-graphql.cjs ${{matrix.graphql_version}}
      - name: Install Dependencies
        run: pnpm i --no-frozen-lockfile
      - name: Cache Vitest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite
          key: ${{runner.os}}-${{matrix.node_version}}-${{matrix.graphql_version}}-vitest-${{hashFiles('pnpm-lock.yaml')}}
          restore-keys: |
            ${{runner.os}}-${{matrix.node_version}}-${{matrix.graphql_version}}-vitest-
      - name: Build
        run: pnpm build
      - name: Test
        run: GRAPHQL_VERSION=${{matrix.graphql_version}} pnpm test
        env:
          CI: true
